# Feedback Pilgrim on NGINX and PHP-FPM, without Docker.
#
# Replace feedback.example.com with APP_DOMAIN, /var/www/feedbackpilgrim with
# the app folder, and the socket with the socket of your PHP-FPM pool.
#
# The certificate must cover feedback.example.com and *.feedback.example.com.
# A wildcard certificate needs a DNS challenge, for example:
#   certbot certonly --dns-cloudflare -d feedback.example.com -d '*.feedback.example.com'
#
# NGINX talks to PHP-FPM directly, so the app sees the real client IP. Leave
# TRUSTED_PROXIES empty in .env, unless Cloudflare or another proxy is in front.

server {
    listen 80;
    listen [::]:80;
    server_name feedback.example.com *.feedback.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedback.example.com *.feedback.example.com;

    ssl_certificate /etc/letsencrypt/live/feedback.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.example.com/privkey.pem;

    root /var/www/feedbackpilgrim/public;
    index index.php;
    charset utf-8;

    # The media library accepts files up to 10 MB (config/media-library.php).
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
