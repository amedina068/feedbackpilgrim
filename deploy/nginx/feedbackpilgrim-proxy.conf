# NGINX as a reverse proxy in front of the Feedback Pilgrim Docker stack.
#
# The web service listens on 127.0.0.1:8080 (APP_BIND and APP_PORT in .env).
# Replace feedback.example.com with APP_DOMAIN.
#
# The certificate must cover feedback.example.com and *.feedback.example.com.
# A wildcard certificate needs a DNS challenge, for example:
#   certbot certonly --dns-cloudflare -d feedback.example.com -d '*.feedback.example.com'
#
# The app sees the requests from the Docker network, not from 127.0.0.1. Set
# TRUSTED_PROXIES=172.16.0.0/12 in .env, so that the app reads the client IP
# and the scheme from the X-Forwarded-* headers below.

server {
    listen 80;
    listen [::]:80;
    server_name feedback.example.com *.feedback.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedback.example.com *.feedback.example.com;

    ssl_certificate /etc/letsencrypt/live/feedback.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.example.com/privkey.pem;

    # The media library accepts files up to 10 MB (config/media-library.php).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The app finds the project from the host. Keep the original Host header.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
