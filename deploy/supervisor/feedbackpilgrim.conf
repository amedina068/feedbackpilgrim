; The Feedback Pilgrim queue worker and scheduler as Supervisor programs.
; Use this file or the systemd units, not both.
;
; Install:
;   sudo cp feedbackpilgrim.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; After each deploy, run "php artisan queue:restart". The worker stops after
; its current job, and Supervisor starts it again with the new code.

[program:feedbackpilgrim-queue]
command=/usr/bin/php /var/www/feedbackpilgrim/artisan queue:work --tries=3
directory=/var/www/feedbackpilgrim
user=www-data
autostart=true
autorestart=true
; A job has 60 seconds (the default --timeout of queue:work).
stopsignal=TERM
stopwaitsecs=70
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/feedbackpilgrim/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:feedbackpilgrim-scheduler]
command=/usr/bin/php /var/www/feedbackpilgrim/artisan schedule:work
directory=/var/www/feedbackpilgrim
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=70
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/feedbackpilgrim/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
