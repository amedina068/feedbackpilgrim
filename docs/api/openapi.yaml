components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: >-
        A personal access token (Laravel Sanctum). Make one in Settings → API Tokens.
        The token belongs to one client and does not expire. Keep it on your server.
    publishableKey:
      type: http
      scheme: bearer
      description: >-
        The publishable key of a client: `pk_` and 32 letters and digits. Find it in Settings → Embed Widget.
        The key is public. Only `POST /api/v1/init` accepts it.
  parameters:
    Search:
      name: search
      in: query
      description: Returns only the records that contain this text.
      example: dark mode
      schema:
        type: string
    TagFilter:
      name: tag
      in: query
      description: Returns only the records with a tag that has this exact title.
      example: feature
      schema:
        type: string
    SortDirection:
      name: sort_direction
      in: query
      description: The direction of the order.
      example: desc
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    PerPage:
      name: per_page
      in: query
      description: The number of records on each page. The API uses 100 for a larger value.
      example: 15
      schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      description: The page number.
      example: 1
      schema:
        type: integer
        default: 1
        minimum: 1
    PostId:
      name: post
      in: path
      required: true
      description: The ID of the post.
      example: 1
      schema:
        type: integer
    ReleaseNoteId:
      name: release_note
      in: path
      required: true
      description: The ID of the release note.
      example: 1
      schema:
        type: integer
    ContactId:
      name: contact
      in: path
      required: true
      description: The ID of the contact.
      example: 1
      schema:
        type: integer
    TestimonialId:
      name: testimonial
      in: path
      required: true
      description: The ID of the testimonial.
      example: 1
      schema:
        type: integer
    TagId:
      name: tag
      in: path
      required: true
      description: The ID of the tag.
      example: 1
      schema:
        type: integer
  headers:
    RetryAfter:
      description: The number of seconds to wait before the next request.
      example: 60
      schema:
        type: integer
    RateLimitLimit:
      description: The number of requests that the user can make each minute.
      example: 120
      schema:
        type: integer
    RateLimitRemaining:
      description: The number of requests that are left in this minute.
      example: 0
      schema:
        type: integer
  responses:
    Unauthorized:
      description: >-
        The API token is missing or wrong, the user is deactivated, or the user is no longer a member of the client of the token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Unauthenticated. Send a valid API token in the Authorization header: "Bearer <token>".'
    NotFound:
      description: The client of the token has no record with this ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: No post with ID 999 exists for the client of this token.
    MethodNotAllowed:
      description: The API does not support this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Method not allowed
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The title field is required.
            errors:
              title:
                - The title field is required.
    TooManyRequests:
      description: The user or the IP address made more than 120 requests in one minute.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.
  schemas:
    Error:
      type: object
      description: An error. Each error has `message`. Some authentication errors also have `error`.
      required:
        - message
      properties:
        message:
          type: string
          description: What went wrong, and how to correct it when the API knows.
        error:
          type: string
          description: A short code-like text for older clients. Read `message` instead.
    ValidationError:
      type: object
      properties:
        message:
          type: string
          description: The first error.
        errors:
          type: object
          description: The error messages for each field.
          additionalProperties:
            type: array
            items:
              type: string
    Pagination:
      type: object
      description: A Laravel paginator.
      properties:
        current_page:
          type: integer
        data:
          type: array
          items: {}
        first_page_url:
          type: string
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: [string, 'null']
              label:
                type: string
              page:
                type: [integer, 'null']
              active:
                type: boolean
        next_page_url:
          type: [string, 'null']
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: [string, 'null']
        to:
          type: [integer, 'null']
        total:
          type: integer
    Tag:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        posts_count:
          type: integer
          description: Only in the list response.
        contacts_count:
          type: integer
          description: Only in the list response.
    TagWrite:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
          description: Unique in the client.
    Stage:
      type: object
      description: A column of the post pipeline.
      properties:
        id:
          type: integer
        client_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        color:
          type: string
        type:
          type: string
          enum: [open, planned, active, complete, closed]
        show_on_roadmap:
          type: boolean
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Vote:
      type: object
      description: A vote of a contact on a post, release note or testimonial.
      additionalProperties: true
      properties:
        id:
          type: integer
        contact_id:
          type: [integer, 'null']
    Comment:
      type: object
      description: A comment on a post, release note or testimonial.
      additionalProperties: true
      properties:
        id:
          type: integer
        content:
          type: string
    Post:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        stage_id:
          type: [integer, 'null']
        board_id:
          type: [integer, 'null']
        contact_id:
          type: [integer, 'null']
        title:
          type: string
        content:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        status:
          type: [string, 'null']
          enum: [pending, in_progress, completed, null]
          description: The stage of the post sets this value.
        stage_position:
          type: [integer, 'null']
        published_at:
          type: [string, 'null']
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        contact:
          oneOf:
            - $ref: '#/components/schemas/Contact'
            - type: 'null'
        stage:
          $ref: '#/components/schemas/Stage'
          description: Only in the create response and in some update responses.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        votes:
          type: array
          items:
            $ref: '#/components/schemas/Vote'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          description: Only in the response for one post.
    PostWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]
        board_id:
          type: integer
          description: The ID of a board of the client. The default is the first board of the client.
        tags:
          type: array
          items:
            type: integer
          description: The IDs of tags of the client.
    PostWriteRequired:
      allOf:
        - $ref: '#/components/schemas/PostWrite'
        - type: object
          required: [title, content]
    ReleaseNote:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        content:
          type: string
        slug:
          type: string
        published_at:
          type: [string, 'null']
          format: date-time
          description: The publication date. `null` means that the note is a draft. Only published notes show on the public site and in the widget.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        votes:
          type: array
          items:
            $ref: '#/components/schemas/Vote'
          description: Only in the list response and in the response for one release note.
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          description: Only in the list response and in the response for one release note.
    ReleaseNoteWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
          description: Markdown.
        published:
          type: boolean
          description: '`true` publishes the note. If the note has no `published_at`, it gets the current time. `false` clears `published_at`, and the note becomes a draft.'
          example: true
        tags:
          type: array
          items:
            type: integer
          description: The IDs of tags of the client.
    ReleaseNoteWriteRequired:
      allOf:
        - $ref: '#/components/schemas/ReleaseNoteWrite'
        - type: object
          required: [title, content]
    Contact:
      type: object
      description: A contact. Each custom metadata field is a field of this object, next to the fields below.
      additionalProperties: true
      properties:
        id:
          type: integer
        uuid:
          type: string
        user_id:
          type: [integer, 'null']
          description: Set when the contact is the admin contact of a user.
        client_id:
          type: integer
        name:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        notes:
          type: [string, 'null']
        avatar:
          type: [string, 'null']
        mrr:
          type: [number, 'null']
          description: Monthly recurring revenue.
        ltv:
          type: [number, 'null']
          description: Lifetime value.
        top_customer:
          type: integer
          enum: [0, 1]
        metadata:
          type: [string, 'null']
          description: >-
            The custom fields as a JSON string. Only in a contact inside another record, such as the contact of a post.
            A contact from the Contacts operations has each custom field as a field of the object.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        votes:
          type: array
          items:
            $ref: '#/components/schemas/Vote'
          description: Only in the list response and in the response for one contact.
    ContactWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        avatar:
          type: string
          format: uri
        mrr:
          type: number
        ltv:
          type: number
        tags:
          type: array
          items:
            type: integer
          description: The IDs of tags of the client.
    ContactWriteRequired:
      description: >-
        The app stores `metadata` and each field that this schema does not name as custom fields of the contact.
        For an existing contact, the app merges the new custom fields with the old ones.
        The custom fields can have 50 keys, 3 levels and 16 KB at most. A key cannot start with `pilgrim_`.
      allOf:
        - $ref: '#/components/schemas/ContactWrite'
        - type: object
          required: [name, email]
          additionalProperties: true
          properties:
            metadata:
              type: object
              additionalProperties: true
              description: Custom fields of the contact.
    Testimonial:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        contact_id:
          type: [integer, 'null']
        title:
          type: [string, 'null']
        description:
          type: string
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        avatar_image:
          type: [string, 'null']
        username:
          type: [string, 'null']
        subtitle:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        contact:
          oneOf:
            - $ref: '#/components/schemas/Contact'
            - type: 'null'
        votes:
          type: array
          items:
            $ref: '#/components/schemas/Vote'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    TestimonialWrite:
      type: object
      properties:
        description:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        username:
          type: string
          maxLength: 255
        approved_at:
          type: string
          format: date-time
          description: Set this field to approve the testimonial.
    TestimonialWriteRequired:
      type: object
      required: [description, username]
      properties:
        description:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        username:
          type: string
          maxLength: 255
        contact_id:
          type: integer
          description: The ID of a contact of the client.
    InitRequest:
      type: object
      properties:
        contact:
          $ref: '#/components/schemas/InitContact'
    InitContact:
      type: object
      additionalProperties: true
      description: >-
        The signed-in user of your app. `email` is necessary to find or create the contact.
        The app stores each field that this schema does not name as custom metadata.
        The app also accepts the same object one level down, in `contact.contact`.
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        mrr:
          type: number
        ltv:
          type: number
        avatar:
          type: string
          format: uri
    InitResponse:
      description: The sign-in link. Without a contact email, the body is an empty JSON array (`[]`).
      oneOf:
        - type: object
          required: [auth_url]
          properties:
            auth_url:
              type: string
              format: uri
              description: The sign-in link of the contact. Valid for 24 hours.
        - type: array
          maxItems: 0
    WidgetInitRequest:
      type: object
      required: [contact]
      properties:
        contact:
          allOf:
            - $ref: '#/components/schemas/InitContact'
            - type: object
              required: [email]
        user_hash:
          type: string
          description: >-
            The HMAC-SHA256 hex digest of the trimmed, lowercase email, with the identity secret of the client as the key.
            Make it on your server.
        releaseNotes:
          type: object
          description: The release notes widget.
          required: [show]
          properties:
            show:
              type: boolean
              description: Return the URL of the release notes iframe.
            open:
              type: boolean
              description: Open the release notes when a new release note exists.
        testimonials:
          type: object
          description: The testimonials widget. Send any object that is not empty to get the iframe URL.
          additionalProperties: true
    WidgetInitResponse:
      type: object
      properties:
        auth_url:
          type: string
          format: uri
          description: >-
            The sign-in link of the contact, valid for 24 hours.
            Without a verified contact, or for an admin contact, it is the URL of the public board.
        releaseNotes:
          type: [object, array]
          description: An empty JSON array (`[]`) when the request has no `releaseNotes`.
          properties:
            url:
              type: string
              format: uri
            show:
              type: boolean
            open:
              type: boolean
        testimonials:
          type: [object, array]
          description: An empty JSON array (`[]`) when the request has no `testimonials`.
          properties:
            url:
              type: string
              format: uri
              description: The URL of the testimonials iframe. For a known contact, it carries a contact token that is valid for 24 hours.
