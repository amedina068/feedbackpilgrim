name: CI

# The jobs need no repository secrets. The PHP tests run two times: on SQLite
# in memory and on MySQL 8.4 (a service container). They use the array mailer
# and the sync queue (phpunit.xml). The E2E tests use a SQLite
# file, the log mailer and the sync queue (.env.e2e), and block each request
# to another host. So no job sends an email, takes a payment or calls a
# third-party API.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request stops the old run of that pull request. A push
# to main does not stop an old run, so each commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, exif
          coverage: none

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

  tests:
    name: PHP tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]
    services:
      mysql:
        # The service starts for both rows of the matrix. Only the mysql row
        # uses it.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: feedbackpilgrim_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, exif, pdo_sqlite, pdo_mysql, redis
          coverage: none

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests on SQLite
        if: matrix.db == 'sqlite'
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      # RefreshDatabase loads database/schema/mysql-schema.sql with the mysql
      # client of the runner.
      - name: Run the tests on MySQL 8.4
        if: matrix.db == 'mysql'
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: feedbackpilgrim_test
          DB_USERNAME: root
          DB_PASSWORD: root

  schema-dump:
    name: Schema dump (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The script compares a database made from the migrations with a
      # database made from the committed dump. It fails when a migration is
      # not in the dump.
      - name: Make sure that the dump matches the migrations
        run: scripts/check-schema-dump.sh ${{ matrix.db }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root

  larastan:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, exif
          coverage: none

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # phpstan.neon sets the level and the paths. phpstan-baseline.neon holds
      # the errors of the code that existed before Larastan, so the job fails
      # only on new errors.
      - name: Run Larastan
        run: composer analyse -- --no-progress --error-format=github

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      # The audit reads composer.lock, so it needs no install. It fails when a
      # locked package has a security advisory.
      - name: Audit the locked PHP packages
        run: composer audit --locked --no-interaction

  assets:
    name: JS build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the dashboard assets and the widget
        run: npm run build

      - name: Run the JS tests
        run: npm run test:js

      - name: Make sure that the build made the widget and the manifest
        run: |
          test -f public/pilgrim.js
          test -f public/build/manifest.json

  vitest:
    name: JavaScript tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # vitest.config.js runs only tests/vitest in jsdom. It does not run the
      # node:test files in tests/js or the Playwright specs in tests/e2e.
      - name: Run the Vue component and composable tests
        run: npm run test:unit

  api-docs:
    name: API docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Make the JSON spec and the Postman files again
        run: composer api-docs

      - name: Fail when the committed files are not current
        run: git diff --exit-code docs/api public/docs/openapi.json

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, exif, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the dashboard assets and the widget
        run: npm run build

      # The Playwright webServer writes .env.e2e (a new APP_KEY, SQLite, the
      # log mailer, the sync queue, no third-party keys), runs migrate:fresh
      # with the E2eSeeder and starts php artisan serve on a free port. Do not
      # create .env and do not cache the config before this step.
      - name: Run the E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
