title: "Question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing discussions and read the [documentation](https://feedbackpilgrim.com/docs) before you ask.
        Do not put a token, a password, an identity secret or other secret in this form.
        Do not report a security problem here. Read SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, the image tag or the commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Docker image from GHCR (docker-compose.image.yml)
        - Docker Compose, built from source (docker-compose.yml)
        - Local install (php artisan serve, Valet, Herd or similar)
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Write your question. Give the steps that you tried and the result that you got.
    validations:
      required: true
