title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        Share an idea that is not ready for a feature request. One person maintains this project. A clear problem statement helps more than a complete solution.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do, and what stops you now?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The proposed solution
      description: Describe the behavior that you want. Name the surface, for example the dashboard, the public site, the widget, the REST API, the MCP server or the Docker setup.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: The workarounds or other solutions that you tried.
